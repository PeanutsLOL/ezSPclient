[package]
name = "ezspclient"
version = "0.2.2"
description = "《卫戍协议：盟约》多平台客户端 —— WebView 外壳 + 服务器地址簿"
authors = ["PeanutsLOL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ezspclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
